# Deploy the static CPR Counter app to GitHub Pages.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Stage app files for deployment
        run: |
          mkdir -p _site
          cp index.html styles.css core.js app.js sw.js update-manager.js manifest.webmanifest icon-192.png icon-512.png _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Only the app files deploy. Development files (sim.html,
          # browser-tests, core-tests.cjs, package.json, docs) are not
          # served from the public site.
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
